<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | 삼성365의원</title>
    <link rel="icon" type="image/png" href="samsung365_logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <meta name="description" content="삼성365의원 로그인 페이지입니다.">
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Pretendard', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#111111',
                            light: '#F8F9FA',
                            accent: '#0C4A9E',
                            gray: '#E9ECEF'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #F8F9FA; color: #111111; }
    </style>
</head>

<body class="antialiased selection:bg-brand-accent selection:text-white break-keep min-h-screen flex flex-col">

    <!-- Simple header -->
    <header class="w-full px-6 py-5 flex items-center justify-between border-b border-gray-100 bg-white">
        <a href="index.html">
            <img src="samsung365_logo.png" alt="삼성365의원" class="h-12 w-auto object-contain">
        </a>
        <a href="community.html" class="text-sm text-gray-400 hover:text-brand-dark transition-colors">← 치료 전/후 보기</a>
    </header>

    <!-- Login Form -->
    <main class="flex-1 flex items-center justify-center px-6 py-16">
        <div class="w-full max-w-[440px]">

            <div class="mb-10 text-center">
                <h1 class="text-2xl font-bold text-brand-dark mb-2">회원 로그인</h1>
                <p class="text-sm text-gray-400 font-light leading-relaxed">
                    치료 전후 사진 및 상세 기록 열람을 위해<br>로그인이 필요합니다.
                </p>
            </div>

            <div class="bg-white border border-gray-100 shadow-[0_8px_40px_-12px_rgba(0,0,0,0.08)] p-8 md:p-10">
                <form id="login-form" class="space-y-3 mb-6">
                    <div>
                        <input type="email" id="login-email" placeholder="이메일 주소" required
                            class="w-full px-5 py-4 bg-gray-50 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-brand-accent/10 focus:border-brand-accent transition-all text-sm">
                    </div>
                    <div>
                        <input type="password" id="login-password" placeholder="비밀번호" required
                            class="w-full px-5 py-4 bg-gray-50 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-brand-accent/10 focus:border-brand-accent transition-all text-sm">
                    </div>
                    <div class="cf-turnstile flex justify-center py-2" data-sitekey="0x4AAAAAADHa5JBRhPuWLUv1"></div>
                    <p id="login-error" class="text-red-500 text-xs hidden text-center font-medium"></p>
                    <button type="submit" id="login-btn"
                        class="w-full py-4 bg-brand-dark text-white font-bold hover:bg-brand-accent transition-all duration-300 mt-2 text-sm tracking-wide">
                        로그인
                    </button>
                </form>
                <div class="flex items-center justify-center gap-6 text-xs text-gray-400">
                    <a href="#" class="hover:text-brand-dark transition-colors">아이디 찾기</a>
                    <span class="w-1 h-1 bg-gray-200 rounded-full"></span>
                    <a href="#" class="hover:text-brand-dark transition-colors">비밀번호 찾기</a>
                    <span class="w-1 h-1 bg-gray-200 rounded-full"></span>
                    <a href="signup.html" class="font-bold text-brand-accent hover:underline decoration-2 underline-offset-4">회원가입</a>
                </div>
            </div>

        </div>
    </main>

    <script src="supabase-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // If already logged in, redirect
            if (window.supabaseClient) {
                try {
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (session) {
                        const urlParams = new URLSearchParams(window.location.search);
                        const returnTo = urlParams.get('returnTo');
                        window.location.href = returnTo || 'community.html';
                        return;
                    }
                } catch(e) {}
            }

            const loginForm = document.getElementById('login-form');
            if (!loginForm) return;

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                const errorMsg = document.getElementById('login-error');
                const loginBtn = document.getElementById('login-btn');

                errorMsg.classList.add('hidden');
                loginBtn.disabled = true;
                loginBtn.textContent = '로그인 중...';

                try {
                    const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]');
                    const captchaToken = turnstileResponse ? turnstileResponse.value : null;

                    if (!captchaToken) {
                        errorMsg.textContent = '보안 확인(CAPTCHA)을 완료해주세요.';
                        errorMsg.classList.remove('hidden');
                        loginBtn.disabled = false;
                        loginBtn.textContent = '로그인';
                        return;
                    }

                    const { error } = await window.supabaseClient.auth.signInWithPassword({
                        email, password,
                        options: { captchaToken }
                    });

                    if (error) throw error;

                    const urlParams = new URLSearchParams(window.location.search);
                    const returnTo = urlParams.get('returnTo');
                    window.location.href = returnTo || 'community.html';

                } catch (error) {
                    let message = error.message;
                    if (message === 'Invalid login credentials') message = '이메일 또는 비밀번호가 올바르지 않습니다.';
                    else if (message === 'Email not confirmed') message = '이메일 인증이 완료되지 않았습니다.';
                    errorMsg.textContent = message;
                    errorMsg.classList.remove('hidden');
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.textContent = '로그인';
                }
            });
        });
    </script>
    <script src="auth-ui.js"></script>

</body>
</html>
