<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어드민 | 삼성365의원</title>
    <link rel="icon" type="image/png" href="samsung365_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Pretendard', sans-serif; }
        .bg-brand-accent { background-color: #0C4A9E; }
        .text-brand-accent { color: #0C4A9E; }
        .preview-box { aspect-ratio: 1/1; object-fit: cover; width: 100%; border-radius: 1rem; }
    </style>
</head>

<body class="overflow-x-hidden bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-100 px-6 py-4">
        <div class="max-w-[900px] mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="samsung365_logo.png" alt="삼성365의원" class="h-10">
                <span class="text-gray-400">|</span>
                <h1 id="page-title" class="font-bold text-gray-900">콘텐츠 관리 시스템 (CMS)</h1>
            </div>
            <a href="community.html" class="text-sm text-gray-500 hover:text-brand-accent font-medium">← 목록으로 돌아가기</a>
        </div>
    </nav>

    <main class="max-w-[900px] mx-auto px-6 py-12">
        <div id="auth-loading" class="text-center py-20">
            <p class="text-gray-500 animate-pulse">관리자 권한 확인 중...</p>
        </div>

        <div id="admin-container" class="hidden">
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 md:p-12">
                <div class="mb-10 flex items-start justify-between">
                    <div>
                        <h2 id="form-title" class="text-2xl font-bold text-gray-900 mb-2">새 임상 사례 등록</h2>
                        <p id="form-desc" class="text-gray-500">비포/애프터 사진과 설명을 입력하여 새로운 치료 사례를 등록하세요.</p>
                    </div>
                    <!-- Delete button (edit mode only) -->
                    <button id="delete-btn" class="hidden px-4 py-2 text-sm font-bold text-red-500 border border-red-200 rounded-xl hover:bg-red-50 transition-colors">
                        🗑 삭제
                    </button>
                </div>

                <form id="upload-form" class="space-y-8">

                    <!-- Title -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">사례 제목</label>
                        <input type="text" id="title" required
                            class="w-full px-6 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-all"
                            placeholder="예: 10년 만성 흉추 통증 개선 사례">
                    </div>

                    <!-- Before / After Upload -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <!-- Before -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                <span class="inline-block px-2 py-0.5 bg-gray-800 text-white text-xs rounded mr-1">BEFORE</span>
                                치료 전 사진
                                <span id="before-optional" class="hidden text-gray-400 font-normal text-xs ml-1">(교체 시에만 선택)</span>
                            </label>
                            <div class="relative">
                                <input type="file" id="before-file" accept="image/*"
                                    class="hidden" onchange="previewImage(this, 'before-preview', 'before-placeholder')">
                                <div class="w-full aspect-square bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-gray-400 transition-colors overflow-hidden"
                                    onclick="document.getElementById('before-file').click()">
                                    <img id="before-preview" class="hidden preview-box">
                                    <div id="before-placeholder" class="text-center p-6">
                                        <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                        </div>
                                        <p class="text-sm text-gray-400 font-medium">클릭하여 사진 선택</p>
                                        <p class="text-xs text-gray-300 mt-1">jpg, png, webp</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- After -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                <span class="inline-block px-2 py-0.5 bg-brand-accent text-white text-xs rounded mr-1">AFTER</span>
                                치료 후 사진
                                <span id="after-optional" class="hidden text-gray-400 font-normal text-xs ml-1">(교체 시에만 선택)</span>
                            </label>
                            <div class="relative">
                                <input type="file" id="after-file" accept="image/*"
                                    class="hidden" onchange="previewImage(this, 'after-preview', 'after-placeholder')">
                                <div class="w-full aspect-square bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-blue-300 transition-colors overflow-hidden"
                                    onclick="document.getElementById('after-file').click()">
                                    <img id="after-preview" class="hidden preview-box">
                                    <div id="after-placeholder" class="text-center p-6">
                                        <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-3">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0C4A9E" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                        </div>
                                        <p class="text-sm text-gray-400 font-medium">클릭하여 사진 선택</p>
                                        <p class="text-xs text-gray-300 mt-1">jpg, png, webp</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Description -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">상세 내용</label>
                        <textarea id="description" rows="5" required
                            class="w-full px-6 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-all resize-none"
                            placeholder="환자의 증상과 치료 과정을 적어주세요."></textarea>
                    </div>

                    <!-- Extra Media -->
                    <div class="border-t border-gray-100 pt-8">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">
                            추가 사진 / 영상
                            <span class="text-gray-400 font-normal ml-1">(선택, 비포/에프터 외 추가 콘텐츠)</span>
                        </label>
                        <p class="text-xs text-gray-400 mb-4">사진(jpg, png, webp) 또는 영상(mp4, mov) 업로드 가능합니다.</p>
                        <input type="file" id="extra-media-file" accept="image/*,video/*"
                            class="hidden" onchange="previewExtra(this)">
                        <div class="w-full bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl overflow-hidden cursor-pointer hover:border-gray-400 transition-colors"
                            onclick="document.getElementById('extra-media-file').click()">
                            <!-- Preview area -->
                            <div id="extra-preview-container" class="hidden relative">
                                <img id="extra-img-preview" class="hidden w-full max-h-[320px] object-contain">
                                <video id="extra-vid-preview" class="hidden w-full max-h-[320px]" controls muted playsinline></video>
                                <button type="button" onclick="clearExtra(event)"
                                    class="absolute top-3 right-3 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center text-lg hover:bg-black/80 transition-colors">×</button>
                            </div>
                            <!-- Placeholder -->
                            <div id="extra-placeholder" class="text-center py-10 px-6">
                                <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                </div>
                                <p class="text-sm text-gray-400 font-medium">클릭하여 파일 선택</p>
                                <p class="text-xs text-gray-300 mt-1">사진 또는 동영상</p>
                            </div>
                        </div>
                        <!-- Extra media clear note (edit mode) -->
                        <div id="extra-existing-note" class="hidden mt-3 flex items-center justify-between text-sm text-gray-500 bg-gray-50 px-4 py-3 rounded-xl">
                            <span id="extra-existing-label">현재 추가 미디어가 등록되어 있습니다.</span>
                            <button type="button" onclick="clearExistingExtra()" class="text-red-400 font-bold hover:text-red-600 text-xs">제거</button>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" id="submit-btn"
                        class="w-full py-5 bg-brand-accent text-white rounded-2xl font-bold text-lg hover:bg-[#093d84] transition-all shadow-xl shadow-blue-900/20">
                        등록하기
                    </button>
                </form>

                <div id="status-msg" class="mt-6 text-center text-sm hidden font-medium"></div>
            </div>
        </div>
    </main>

    <script src="supabase-client.js"></script>
    <script>
        function previewImage(input, previewId, placeholderId) {
            const file = input.files[0];
            if (!file) return;
            const preview = document.getElementById(previewId);
            const placeholder = document.getElementById(placeholderId);
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                if (placeholder) placeholder.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        function previewExtra(input) {
            const file = input.files[0];
            if (!file) return;
            const isVideo = file.type.startsWith('video/');
            const container = document.getElementById('extra-preview-container');
            const imgPrev = document.getElementById('extra-img-preview');
            const vidPrev = document.getElementById('extra-vid-preview');
            const placeholder = document.getElementById('extra-placeholder');
            const url = URL.createObjectURL(file);
            if (isVideo) {
                vidPrev.src = url;
                vidPrev.classList.remove('hidden');
                imgPrev.classList.add('hidden');
            } else {
                imgPrev.src = url;
                imgPrev.classList.remove('hidden');
                vidPrev.classList.add('hidden');
            }
            container.classList.remove('hidden');
            placeholder.classList.add('hidden');
        }

        function clearExtra(e) {
            e.stopPropagation();
            document.getElementById('extra-media-file').value = '';
            document.getElementById('extra-img-preview').src = '';
            document.getElementById('extra-img-preview').classList.add('hidden');
            document.getElementById('extra-vid-preview').src = '';
            document.getElementById('extra-vid-preview').classList.add('hidden');
            document.getElementById('extra-preview-container').classList.add('hidden');
            document.getElementById('extra-placeholder').classList.remove('hidden');
        }

        let removeExistingExtra = false;
        function clearExistingExtra() {
            removeExistingExtra = true;
            document.getElementById('extra-existing-note').classList.add('hidden');
        }

        const ADMIN_EMAIL = 'admin@365.com';

        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('admin-container');
            const loading = document.getElementById('auth-loading');

            const { data: { session } } = await window.supabaseClient.auth.getSession();

            if (!session || session.user.email !== ADMIN_EMAIL) {
                alert('관리자 권한이 없습니다.');
                window.location.href = 'community.html';
                return;
            }

            loading.classList.add('hidden');
            container.classList.remove('hidden');

            // Check if editing existing case
            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('edit');
            let existingBeforeUrl = null;
            let existingAfterUrl = null;
            let existingExtraImageUrl = null;
            let existingExtraVideoUrl = null;

            if (editId) {
                // EDIT MODE
                document.getElementById('page-title').textContent = '사례 수정';
                document.getElementById('form-title').textContent = '임상 사례 수정';
                document.getElementById('form-desc').textContent = '내용을 수정하세요. 사진은 교체할 경우에만 새로 선택하면 됩니다.';
                document.getElementById('submit-btn').textContent = '수정 저장하기';
                document.getElementById('delete-btn').classList.remove('hidden');
                document.getElementById('before-optional').classList.remove('hidden');
                document.getElementById('after-optional').classList.remove('hidden');
                // Before/after not required in edit mode
                document.getElementById('before-file').removeAttribute('required');
                document.getElementById('after-file').removeAttribute('required');

                // Fetch existing data
                const { data, error } = await window.supabaseClient
                    .from('clinical_cases')
                    .select('*')
                    .eq('id', editId)
                    .single();

                if (error || !data) {
                    alert('해당 사례를 찾을 수 없습니다.');
                    window.location.href = 'community.html';
                    return;
                }

                // Pre-fill form
                document.getElementById('title').value = data.title || '';
                document.getElementById('description').value = data.description || '';
                existingBeforeUrl = data.before_url;
                existingAfterUrl = data.after_url;
                existingExtraImageUrl = data.image_url || null;
                existingExtraVideoUrl = data.video_url || null;

                // Show existing extra media note
                if (data.image_url || data.video_url) {
                    const note = document.getElementById('extra-existing-note');
                    const label = document.getElementById('extra-existing-label');
                    label.textContent = data.video_url ? '현재 동영상이 등록되어 있습니다. (교체하려면 위에서 새 파일 선택)' : '현재 추가 사진이 등록되어 있습니다. (교체하려면 위에서 새 파일 선택)';
                    note.classList.remove('hidden');
                }

                // Show existing images as preview
                if (data.before_url) {
                    const beforePreview = document.getElementById('before-preview');
                    beforePreview.src = data.before_url;
                    beforePreview.classList.remove('hidden');
                    document.getElementById('before-placeholder').classList.add('hidden');
                }
                if (data.after_url) {
                    const afterPreview = document.getElementById('after-preview');
                    afterPreview.src = data.after_url;
                    afterPreview.classList.remove('hidden');
                    document.getElementById('after-placeholder').classList.add('hidden');
                }

                // Delete button
                document.getElementById('delete-btn').addEventListener('click', async () => {
                    if (!confirm('이 사례를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;
                    const { error: delErr } = await window.supabaseClient
                        .from('clinical_cases')
                        .delete()
                        .eq('id', editId);
                    if (delErr) {
                        alert('삭제 중 오류: ' + delErr.message);
                    } else {
                        alert('삭제 완료!');
                        window.location.href = 'community.html';
                    }
                });
            }

            const uploadForm = document.getElementById('upload-form');
            const submitBtn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-msg');

            // --- WebP 자동 변환 헬퍼 함수 ---
            const convertToWebP = (file, quality = 0.8) => {
                return new Promise((resolve, reject) => {
                    if (!file.type.startsWith('image/')) {
                        resolve(file); // 이미지가 아니면(예: 동영상) 그대로 통과
                        return;
                    }
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, img.width, img.height);
                            // WebP 형태로 압축 (quality 0.8 = 80%)
                            canvas.toBlob((blob) => {
                                if(!blob) {
                                    resolve(file); // 실패시 원본 통과
                                    return;
                                }
                                // 원본 파일명을 참조하여 확장자를 webp로 변경
                                const fileName = file.name.replace(/\.[^/.]+$/, "") + ".webp";
                                const webpFile = new File([blob], fileName, {
                                    type: 'image/webp',
                                    lastModified: Date.now(),
                                });
                                resolve(webpFile);
                            }, 'image/webp', quality);
                        };
                        img.onerror = () => resolve(file);
                    };
                    reader.onerror = () => resolve(file);
                });
            };

            uploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const title = document.getElementById('title').value.trim();
                const description = document.getElementById('description').value.trim();
                const beforeFileOriginal = document.getElementById('before-file').files[0];
                const afterFileOriginal = document.getElementById('after-file').files[0];
                const extraFileOriginal = document.getElementById('extra-media-file').files[0];

                // In create mode, both files are required
                if (!editId && (!beforeFileOriginal || !afterFileOriginal)) {
                    alert('비포와 에프터 사진을 모두 선택해주세요.');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '처리 중... (이미지 최적화)';
                statusMsg.classList.remove('hidden');
                statusMsg.className = 'mt-6 text-center text-sm text-blue-500 font-medium';
                statusMsg.textContent = '사진을 업로드하는 중입니다...';

                try {
                    let beforeUrl = existingBeforeUrl;
                    let afterUrl = existingAfterUrl;

                    // 업로드 전 WebP 자동 변환
                    const beforeFile = beforeFileOriginal ? await convertToWebP(beforeFileOriginal) : null;
                    const afterFile = afterFileOriginal ? await convertToWebP(afterFileOriginal) : null;
                    const extraFile = extraFileOriginal ? await convertToWebP(extraFileOriginal) : null;

                    // Upload new BEFORE image if selected
                    if (beforeFile) {
                        const path = `before/${Date.now()}-${Math.random().toString(36).substring(2)}.webp`;
                        const { error: err } = await window.supabaseClient.storage.from('casese').upload(path, beforeFile);
                        if (err) throw err;
                        const { data: { publicUrl } } = window.supabaseClient.storage.from('casese').getPublicUrl(path);
                        beforeUrl = publicUrl;
                    }

                    // Upload new AFTER image if selected
                    if (afterFile) {
                        const path = `after/${Date.now()}-${Math.random().toString(36).substring(2)}.webp`;
                        const { error: err } = await window.supabaseClient.storage.from('casese').upload(path, afterFile);
                        if (err) throw err;
                        const { data: { publicUrl } } = window.supabaseClient.storage.from('casese').getPublicUrl(path);
                        afterUrl = publicUrl;
                    }

                    statusMsg.textContent = '데이터베이스에 저장 중입니다...';

                    // Upload extra media if selected
                    let extraImageUrl = existingExtraImageUrl;
                    let extraVideoUrl = existingExtraVideoUrl;

                    if (removeExistingExtra) {
                        extraImageUrl = null;
                        extraVideoUrl = null;
                    }

                    if (extraFile) {
                        const isVideo = extraFile.type.startsWith('video/');
                        const folder = isVideo ? 'extra-video' : 'extra-image';
                        // extraFile name already contains .webp if it was an image converted by our helper
                        const ext = extraFile.name.split('.').pop();
                        const path = `${folder}/${Date.now()}-${Math.random().toString(36).substring(2)}.${ext}`;
                        const { error: extraErr } = await window.supabaseClient.storage.from('casese').upload(path, extraFile);
                        if (extraErr) throw extraErr;
                        const { data: { publicUrl: extraUrl } } = window.supabaseClient.storage.from('casese').getPublicUrl(path);
                        if (isVideo) {
                            extraVideoUrl = extraUrl;
                            extraImageUrl = null; // clear old image if video uploaded
                        } else {
                            extraImageUrl = extraUrl;
                            extraVideoUrl = null; // clear old video if image uploaded
                        }
                    }

                    let dbError;
                    if (editId) {
                        const { error } = await window.supabaseClient
                            .from('clinical_cases')
                            .update({ title, description, before_url: beforeUrl, after_url: afterUrl, image_url: extraImageUrl, video_url: extraVideoUrl })
                            .eq('id', editId);
                        dbError = error;
                    } else {
                        const { error } = await window.supabaseClient
                            .from('clinical_cases')
                            .insert([{ title, description, before_url: beforeUrl, after_url: afterUrl, image_url: extraImageUrl, video_url: extraVideoUrl }]);
                        dbError = error;
                    }

                    if (dbError) throw dbError;

                    statusMsg.className = 'mt-6 text-center text-sm text-green-600 font-bold';
                    statusMsg.textContent = editId ? '✅ 수정이 완료되었습니다!' : '✅ 등록이 완료되었습니다!';

                    setTimeout(() => {
                        const msg = editId ? '수정 완료! 치료 전/후 페이지로 이동하시겠습니까?' : '등록 완료! 치료 전/후 페이지로 이동하시겠습니까?';
                        if (confirm(msg)) window.location.href = 'community.html';
                    }, 500);

                } catch (error) {
                    console.error(error);
                    statusMsg.className = 'mt-6 text-center text-sm text-red-500 font-bold';
                    statusMsg.textContent = '❌ 오류 발생: ' + error.message;
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = editId ? '수정 저장하기' : '등록하기';
                }
            });
        });
    </script>
    <script src="non-benefit.js"></script>
    <script src="legal.js"></script>
</body>

</html>
