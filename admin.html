<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어드민 | 삼성365의원</title>
    <link rel="icon" type="image/png" href="samsung365_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Pretendard', sans-serif; }
        .bg-brand-accent { background-color: #0C4A9E; }
        .text-brand-accent { color: #0C4A9E; }
        .preview-box { aspect-ratio: 1/1; object-fit: cover; width: 100%; border-radius: 1rem; }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-100 px-6 py-4">
        <div class="max-w-[900px] mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="samsung365_logo.png" alt="삼성365의원" class="h-10">
                <span class="text-gray-400">|</span>
                <h1 class="font-bold text-gray-900">콘텐츠 관리 시스템 (CMS)</h1>
            </div>
            <a href="community.html" class="text-sm text-gray-500 hover:text-brand-accent font-medium">← 커뮤니티로 돌아가기</a>
        </div>
    </nav>

    <main class="max-w-[900px] mx-auto px-6 py-12">
        <div id="auth-loading" class="text-center py-20">
            <p class="text-gray-500 animate-pulse">관리자 권한 확인 중...</p>
        </div>

        <div id="admin-container" class="hidden">
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 md:p-12">
                <div class="mb-10">
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">새 임상 사례 등록</h2>
                    <p class="text-gray-500">비포/애프터 사진과 설명을 입력하여 새로운 치료 사례를 등록하세요.</p>
                </div>

                <form id="upload-form" class="space-y-8">

                    <!-- Title -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">사례 제목</label>
                        <input type="text" id="title" required
                            class="w-full px-6 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-all"
                            placeholder="예: 10년 만성 흉추 통증 개선 사례">
                    </div>

                    <!-- Before / After Upload -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <!-- Before -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                <span class="inline-block px-2 py-0.5 bg-gray-800 text-white text-xs rounded mr-1">BEFORE</span>
                                치료 전 사진
                            </label>
                            <div class="relative">
                                <input type="file" id="before-file" accept="image/*" required
                                    class="hidden" onchange="previewImage(this, 'before-preview')">
                                <div id="before-preview-container"
                                    class="w-full aspect-square bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-gray-400 transition-colors overflow-hidden"
                                    onclick="document.getElementById('before-file').click()">
                                    <img id="before-preview" class="hidden preview-box">
                                    <div id="before-placeholder" class="text-center p-6">
                                        <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                        </div>
                                        <p class="text-sm text-gray-400 font-medium">클릭하여 사진 선택</p>
                                        <p class="text-xs text-gray-300 mt-1">jpg, png, webp</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- After -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                <span class="inline-block px-2 py-0.5 bg-brand-accent text-white text-xs rounded mr-1">AFTER</span>
                                치료 후 사진
                            </label>
                            <div class="relative">
                                <input type="file" id="after-file" accept="image/*" required
                                    class="hidden" onchange="previewImage(this, 'after-preview')">
                                <div id="after-preview-container"
                                    class="w-full aspect-square bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-blue-300 transition-colors overflow-hidden"
                                    onclick="document.getElementById('after-file').click()">
                                    <img id="after-preview" class="hidden preview-box">
                                    <div id="after-placeholder" class="text-center p-6">
                                        <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-3">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0C4A9E" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                        </div>
                                        <p class="text-sm text-gray-400 font-medium">클릭하여 사진 선택</p>
                                        <p class="text-xs text-gray-300 mt-1">jpg, png, webp</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Description -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">상세 내용</label>
                        <textarea id="description" rows="5" required
                            class="w-full px-6 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-all resize-none"
                            placeholder="환자의 증상과 치료 과정을 적어주세요."></textarea>
                    </div>

                    <!-- Submit -->
                    <button type="submit" id="submit-btn"
                        class="w-full py-5 bg-brand-accent text-white rounded-2xl font-bold text-lg hover:bg-[#093d84] transition-all shadow-xl shadow-blue-900/20">
                        등록하기
                    </button>
                </form>

                <div id="status-msg" class="mt-6 text-center text-sm hidden font-medium"></div>
            </div>
        </div>
    </main>

    <script src="supabase-client.js"></script>
    <script>
        function previewImage(input, previewId) {
            const file = input.files[0];
            if (!file) return;
            const preview = document.getElementById(previewId);
            const placeholder = document.getElementById(previewId.replace('-preview', '-placeholder'));
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                if (placeholder) placeholder.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        const ADMIN_EMAIL = 'admin@365.com';

        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('admin-container');
            const loading = document.getElementById('auth-loading');

            const { data: { session } } = await window.supabaseClient.auth.getSession();

            if (!session || session.user.email !== ADMIN_EMAIL) {
                alert('관리자 권한이 없습니다.');
                window.location.href = 'community.html';
                return;
            }

            loading.classList.add('hidden');
            container.classList.remove('hidden');

            const uploadForm = document.getElementById('upload-form');
            const submitBtn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-msg');

            uploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const title = document.getElementById('title').value.trim();
                const description = document.getElementById('description').value.trim();
                const beforeFile = document.getElementById('before-file').files[0];
                const afterFile = document.getElementById('after-file').files[0];

                if (!beforeFile || !afterFile) {
                    alert('비포와 에프터 사진을 모두 선택해주세요.');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '업로드 중...';
                statusMsg.classList.remove('hidden');
                statusMsg.className = 'mt-6 text-center text-sm text-blue-500 font-medium';
                statusMsg.textContent = '사진을 업로드하는 중입니다...';

                try {
                    // Upload BEFORE image
                    const beforeExt = beforeFile.name.split('.').pop();
                    const beforePath = `before/${Date.now()}-${Math.random().toString(36).substring(2)}.${beforeExt}`;
                    const { error: beforeErr } = await window.supabaseClient.storage.from('casese').upload(beforePath, beforeFile);
                    if (beforeErr) throw beforeErr;
                    const { data: { publicUrl: beforeUrl } } = window.supabaseClient.storage.from('casese').getPublicUrl(beforePath);

                    // Upload AFTER image
                    const afterExt = afterFile.name.split('.').pop();
                    const afterPath = `after/${Date.now()}-${Math.random().toString(36).substring(2)}.${afterExt}`;
                    const { error: afterErr } = await window.supabaseClient.storage.from('casese').upload(afterPath, afterFile);
                    if (afterErr) throw afterErr;
                    const { data: { publicUrl: afterUrl } } = window.supabaseClient.storage.from('casese').getPublicUrl(afterPath);

                    statusMsg.textContent = '데이터베이스에 저장 중입니다...';

                    // Insert to DB
                    const { error: dbError } = await window.supabaseClient
                        .from('clinical_cases')
                        .insert([{ title, description, before_url: beforeUrl, after_url: afterUrl }]);

                    if (dbError) throw dbError;

                    statusMsg.className = 'mt-6 text-center text-sm text-green-600 font-bold';
                    statusMsg.textContent = '✅ 등록이 성공적으로 완료되었습니다!';
                    uploadForm.reset();
                    document.getElementById('before-preview').classList.add('hidden');
                    document.getElementById('after-preview').classList.add('hidden');
                    document.getElementById('before-placeholder').classList.remove('hidden');
                    document.getElementById('after-placeholder').classList.remove('hidden');

                    setTimeout(() => {
                        if (confirm('등록 완료! 커뮤니티 페이지로 이동하시겠습니까?')) {
                            window.location.href = 'community.html';
                        }
                    }, 500);

                } catch (error) {
                    console.error(error);
                    statusMsg.className = 'mt-6 text-center text-sm text-red-500 font-bold';
                    statusMsg.textContent = '❌ 오류 발생: ' + error.message;
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '등록하기';
                }
            });
        });
    </script>
    <script src="non-benefit.js"></script>
    <script src="legal.js"></script>
</body>

</html>
